# PlanTim — HTTPS virtual host (samo IP adresa, Windows Server + XAMPP)
# Uključite u httpd.conf: Include conf/extra/plantim-https-ip.conf
#
# Prije uključivanja:
# 1. Pokrenite SETUP_WINDOWS_HTTPS.bat (generiše SSL certifikat)
# 2. npm run build u frontend/ folderu
# 3. Zamijenite 77.77.210.70 sa vašom IP ako je drugačija

Listen 443

<VirtualHost *:443>
    ServerName 77.77.210.70
    DocumentRoot "C:/xampp/htdocs/PlanTim/frontend/dist"

    SSLEngine on
    SSLCertificateFile "conf/ssl.crt/plantim-server.crt"
    SSLCertificateKeyFile "conf/ssl.key/plantim-server.key"

    # React SPA (frontend/dist)
    <Directory "C:/xampp/htdocs/PlanTim/frontend/dist">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Laravel API
    Alias /api "C:/xampp/htdocs/PlanTim/public"
    <Directory "C:/xampp/htdocs/PlanTim/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Uploadi, avatari
    Alias /storage "C:/xampp/htdocs/PlanTim/storage/app/public"
    <Directory "C:/xampp/htdocs/PlanTim/storage/app/public">
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog "logs/plantim-ssl-error.log"
    CustomLog "logs/plantim-ssl-access.log" combined
</VirtualHost>

# Preusmjeri HTTP na HTTPS
<VirtualHost *:80>
    ServerName 77.77.210.70
    Redirect permanent / https://77.77.210.70/
</VirtualHost>
